<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Реальные CSS SillyTavern + Moonlit (скопированы как есть), затем наши переменные Cappuccino -->
  <link rel="stylesheet" href="fontawesome.min.css" />
  <link rel="stylesheet" href="solid.min.css" />
  <link rel="stylesheet" href="st-tailwind.css" />
  <link rel="stylesheet" href="st-animations.css" />
  <link rel="stylesheet" href="st-style.css" />
  <link rel="stylesheet" href="moonlit-extension.css" />
  <link rel="stylesheet" href="moonlit-style.css" />
  <link rel="stylesheet" href="base-vars.css" />
  <style>
    /* RLM: поле ввода — во всю ширину ПОД рядом кнопок (кнопки сверху, зона письма снизу) */
    #send_form { align-items: center; }
    #rightSendForm { margin-left: auto; }              /* кнопку отправки — к правому краю верхнего ряда */
    #send_textarea { order: 10; flex: 1 0 100%; width: 100%; min-height: 3.6em; }   /* две строки — крупная цель для пальца */
    /* RLM: кнопки действий над полем ввода */
    #rlm-actions { display: flex; gap: 6px; padding: 4px 6px 1px; justify-content: flex-start; }   /* прижать к блоку ввода */
    .rlm-act { font-family: inherit; font-size: 10px; color: var(--SmartThemeBodyColor, #cdd); background: transparent;
      border: 1px solid color-mix(in srgb, var(--SmartThemeBodyColor, #889) 40%, transparent); border-radius: 6px;
      padding: 1px 7px; cursor: pointer; opacity: 1; transition: all 0.2s ease; }
    .rlm-act:hover { border-color: var(--customThemeColor, #8ab); }
    /* RLM: «Собрать главу» — появляется, когда отмечена сцена ►◄; акцентная */
    .rlm-build { opacity: 1; color: #eaf2f8; border-color: #66c0f4; background: rgba(102, 192, 244, 0.12); }
    .rlm-build:hover { border-color: #66c0f4; background: rgba(102, 192, 244, 0.22); }
    /* RLM группа: «След. ход» — акцент коробки передач */
    .rlm-next { opacity: 1; color: #f2e6d2; border-color: #cda36a; background: rgba(205, 163, 106, 0.14); }
    .rlm-next:hover { border-color: #cda36a; background: rgba(205, 163, 106, 0.26); }
    .rlm-auto { opacity: 1; color: #f2e6d2; border-color: #cda36a; background: rgba(205, 163, 106, 0.10); }
    .rlm-auto:hover { border-color: #cda36a; background: rgba(205, 163, 106, 0.22); }
    .rlm-auto.on { color: #20191b; background: #cda36a; border-color: #cda36a; font-weight: 600; }
    /* RLM: inline-редактор реплики */
    .mes-edit { width: 100%; box-sizing: border-box; min-height: 60px; font-family: inherit; font-size: inherit;
      color: inherit; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--customThemeColor, #8ab);
      border-radius: 6px; padding: 6px; resize: vertical; }
    /* RLM: МОБИЛЬНЫЙ редактор реплики — лист, ЗАКРЕПЛЁННЫЙ над клавиатурой (fixed + visualViewport).
       Клавиатура не двигает его целиком: лист «садится» ровно над ней, а текст скроллится ВНУТРИ textarea. */
    .mes-edit-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.45); }
    .mes-edit-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; display: flex; flex-direction: column;
      background: var(--SmartThemeBlurTintColor, #1b1719); border-top: 1px solid var(--customThemeColor, #8ab);
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.5); }
    .mes-edit-sheet .mes-edit-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .mes-edit-sheet .mes-edit-title { flex: 1; text-align: center; font-size: 13px; opacity: 0.8; }
    .mes-edit-sheet .mes-edit-btn { font-family: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid color-mix(in srgb, var(--SmartThemeBodyColor, #889) 40%, transparent); background: transparent; color: inherit; }
    .mes-edit-sheet .mes-edit-save { border-color: var(--customThemeColor, #8ab); color: #eaf2f8; background: rgba(102, 192, 244, 0.14); font-weight: 600; }
    /* textarea заполняет лист и скроллится внутри; 16px — чтобы мобильный браузер не зумил при фокусе */
    .mes-edit-sheet textarea.mes-edit { flex: 1 1 auto; width: 100%; box-sizing: border-box; min-height: 0; margin: 0;
      border: none; border-radius: 0; background: transparent; resize: none; overflow-y: auto; padding: 12px; font-size: 16px; line-height: 1.5; }
    /* RLM: разметка сцены (каретки старт/конец, как в MachineMechanic) — ИНЛАЙН внутри имени */
    .mes-scene-start, .mes-scene-end { font-size: 22px; line-height: 0; opacity: 0.5; cursor: pointer; vertical-align: middle; margin-left: 8px; font-weight: 400; transition: opacity .12s, color .12s; }
    .mes-scene-start:hover, .mes-scene-end:hover { opacity: 1; }
    .mes-scene-start.on { color: #6ee87a; opacity: 1; }
    .mes-scene-end.on { color: #e0a35a; opacity: 1; }
    /* RLM: ряд действий под сообщением — все иконки FontAwesome, ЕДИНЫЙ размер и центровка по базовой линии.
       (раньше ↻ / 💬 / 🔊 были эмодзи и разъезжались по размеру и высоте — отсюда «беспорядок») */
    /* Размер значков сообщения = как у значков ввода (15px), gap меньше — чтобы влезали в мобильной ширине. */
    .mes .mes_buttons { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .mes .mes_buttons > .mes_button { font-size: 15px !important; line-height: 1; height: 16px; width: auto; margin: 0;
      display: inline-flex; align-items: center; justify-content: center;
      opacity: 0.5; cursor: pointer; transition: opacity .12s, color .12s; }
    .mes .mes_buttons > .mes_button:hover,
    .mes .mes_buttons > .mes_button.on { opacity: 1; }
    .mes .mes_buttons > .mes_button.busy { opacity: 0.3; pointer-events: none; }
    .mes-regen:hover, .mes-tr:hover { color: var(--customThemeColor, #8ab); }
    /* Выбор первого сообщения (перед началом ролки): стрелки ‹ › под приветствием */
    .rlm-greet-nav { display: flex; align-items: center; gap: 8px; margin: 8px 2px 0; }
    .rlm-greet-arrow { font-size: 15px; line-height: 1; color: inherit; background: rgba(127,127,127,.12);
      border: 1px solid rgba(127,127,127,.32); border-radius: 4px; padding: 1px 11px; cursor: pointer; opacity: .8; transition: opacity .12s, background .12s; }
    .rlm-greet-arrow:hover { opacity: 1; background: rgba(127,127,127,.24); }
    .rlm-greet-count { font-size: 12px; opacity: .7; min-width: 42px; text-align: center; }
    /* Текст сообщения использует больше ширины справа — уменьшенный правый паддинг блока (было 15px). */
    body.ripplestyle #chat .mes .mes_block { padding-right: 5px !important; }
    /* RLM: СКРИМ-затенение — тёмный слой ПОВЕРХ низа чата (сообщения + фон), с РАЗМЫТЫМ верхним краем.
       Слои: чат (z0) → скрим (z1) → кнопки/лента/полоса/ввод (z2). Параметры в CSS-переменных — крутятся
       ползунком вживую (тёмность / высота / размытие), сохраняются в localStorage. */
    :root { --rlm-shade-d: .82; --rlm-shade-h: 210px; --rlm-shade-blur: 3px; }
    /* Кнопки и лента загрузки БОЛТАЮТСЯ В ВОЗДУХЕ над чатом — без плашки и без отдельной полосы.
       Зона поднята на чат (margin-top<0) и НЕ занимает своё место в потоке → ввод встаёт под чат,
       тёмной полосы-«плашки» между чатом и вводом не остаётся. Прозрачная; клики проходят к чату (кликабельны только кнопки). */
    /* Затенение над вводом = два слоя:
       (1) БЛЮР #sheld::after (Размытие) — ПОЗАДИ текста (z ниже #chat): мылит только фон-картинку у низа, не трогая текст;
           поэтому нет цветной каймы над контентом (она была, когда блюр лежал ПОВЕРХ текста).
       (2) ТЁМНЫЙ ГРАДИЕНТ #rlm-zone::before (Тёмность/Высота) — от верхней границы блока ввода вверх, ПОВЕРХ текста;
           тёмная часть закрывает кромку прокрутки → текст плавно тает, не режется. */
    /* И ГРАДИЕНТ, и БЛЮР анкерятся на ВЕРХ блока ввода (низ #rlm-zone) и идут ВВЕРХ — накрывают только зону кнопок,
       НЕ касаясь блока ввода сообщения. Блюр держим в тёмной зоне (маска 20→42%), чтобы не было цветной каймы над читаемым текстом. */
    #chat { position: relative; z-index: 0; max-height: none !important; min-height: 0; }
    /* RLM: запас прокрутки снизу — чтобы ПОСЛЕДНЕЕ сообщение (и его теги-источники/критик под ним) можно
       было домотать ВЫШЕ нижней зоны (ввод + затенение), а не упираться в неё. Растёт вместе с высотой
       затенения (--rlm-shade-h), поэтому при любой настройке скрима низ всегда домотывается. */
    #chat { padding-bottom: calc(var(--rlm-shade-h) + 40px) !important; }
    /* Телефон: поле ввода выше (крупная тач-цель) + системная полоса снизу (home-бар / safe-area) съедают запас —
       низ последнего сообщения (теги-источники / критик / состояние) упирался в ввод и не домётывался.
       Даём БОЛЬШЕ места домотать чат вниз + учитываем safe-area, чтобы теги всегда читались над вводом. */
    @media (max-width: 820px) {
      #chat { padding-bottom: calc(var(--rlm-shade-h) + 120px + env(safe-area-inset-bottom, 0px)) !important; }
    }
    #rlm-zone { position: relative; z-index: 2; margin-top: -38px; background: none; pointer-events: none; }
    #rlm-zone::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: var(--rlm-shade-h); z-index: -2; pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,var(--rlm-shade-d)) 0%, rgba(0,0,0,var(--rlm-shade-d)) 46%, rgba(0,0,0,0) 100%); }
    #rlm-zone::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: var(--rlm-shade-h); z-index: -1; pointer-events: none;
      -webkit-backdrop-filter: blur(var(--rlm-shade-blur)); backdrop-filter: blur(var(--rlm-shade-blur));
      -webkit-mask-image: linear-gradient(to top, #000 20%, transparent 42%); mask-image: linear-gradient(to top, #000 20%, transparent 42%); }
    .rlm-ctl { position: relative; z-index: 1; pointer-events: none; }
    #rlm-actions { pointer-events: none; }
    .rlm-act, #rlm-proc, #rlm-proc-bar { pointer-events: auto; }
    /* Блок ввода НЕ трогаем градиентом/блюром/подложкой — он остаётся чистым (затенение только над ним, на зоне кнопок). */
    #form_sheld { position: relative; z-index: 2; border-top: 0 !important; box-shadow: none !important; }
    /* Светящаяся акцентная линия ввода — ПОСТОЯННО (как при активном фокусе), а не только когда пишешь. */
    #send_form { background: transparent !important; opacity: 1 !important;
      border: 0 !important; border-top: 1.25px solid var(--customThemeColor, #8ab) !important;
      box-shadow: 0 -2px 12px -4px color-mix(in srgb, var(--customThemeColor, #8ab) 45%, transparent) !important; }
    @media (max-width: 1000px) { #send_form { border-radius: 10px 10px 0 0 !important; } }
    /* Телефон: чат на ВСЮ ширину — «Ширина чата» из опций только для десктопа, на телефоне боковые поля не нужны. */
    @media (max-width: 820px) { #sheld { width: 100% !important; } }
    /* Параметры затенения (--rlm-shade-*) крутятся в панели настроек чата (RLM), рассылаются в оба кадра. */
    /* строка процесса: текст по центру + крестик символом в конце названия (не кнопка) */
    .rlm-ctl { position: relative; }
    /* строка процесса ПЕРЕКРЫВАЕТ ряд кнопок (абсолютом поверх) — кнопки не двигаются */
    #rlm-proc { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center; padding: 0 12px; text-align: center; }
    #rlm-proc[hidden] { display: none; }
    .rlm-proc-text { font-size: 13px; color: var(--SmartThemeBodyColor, #ddd); }
    .rlm-proc-text.ok  { color: #6ee87a; }
    .rlm-proc-text.err { color: #e0645a; }
    .rlm-proc-text.scene { color: var(--customThemeColor, #66c0f4); }
    .rlm-proc-x { margin-left: 8px; font-size: 13px; line-height: 1; cursor: pointer;
      color: color-mix(in srgb, var(--SmartThemeBodyColor, #889) 55%, transparent); }
    .rlm-proc-x:hover { color: #e0645a; }
    .rlm-proc-x[hidden] { display: none; }
    /* полоса процесса — анимируется из JS (реально движется в любом рендере) */
    #rlm-proc-bar { position: relative; z-index: 1; height: 3px; margin: 5px 10px 0; border-radius: 3px;
      background: rgba(255,255,255,.06); overflow: hidden; opacity: 0; transition: opacity .2s; }
    #rlm-proc-bar.on { opacity: 1; }
    #rlm-proc-bar > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px;
      opacity: 0; background: var(--customThemeColor, #51a0de); font-style: normal; }
    .mes-tr.on { color: #66c0f4; opacity: 1; }
    .mes-tr-busy, #rlm-tr-input.busy { opacity: 0.4; pointer-events: none; }
    .mes.stmb-in-scene { box-shadow: inset 3px 0 0 rgba(110, 232, 122, 0.55); }
    /* RLM Хроника: подпись сцены (всегда, вверху сообщения) + «призрак» — сообщение свёрнуто и НЕ идёт в контекст */
    .mes-scene-tag { display: inline-block; font-size: 10px; letter-spacing: .3px; line-height: 1.4;
      color: var(--cap-italic, #d8c4a8); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px; padding: 1px 9px; margin: 0 0 5px 0; opacity: .9; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mes.mes-ghost { opacity: .5; }
    .mes.mes-ghost .mes_text { font-style: italic; }
    .mes-ghost-ic { margin-left: 6px; font-size: .9em; opacity: .85; cursor: default; }
    /* RLM группа: реплика Рассказчика — прозой во всю ширину, без аватара и имени (без курсива) */
    #chat .mes.mes-narr .mes_block { flex: 1 1 auto; width: 100%; min-width: 0; }
    /* RLM группа: активный говорящий («на передаче») — имя и аватар золотым акцентом коробки передач */
    #chat .mes.mes-active-speaker .name_text { color: #cda36a; }
    #chat .mes.mes-active-speaker .avatar { box-shadow: 0 0 0 2px #cda36a; }
    .mes.stmb-flash { animation: stmbFlash 1.4s ease-out; }
    @keyframes stmbFlash { 0% { background: rgba(110, 232, 122, 0.22); } 100% { background: transparent; } }
    /* RLM: теги-источники под ответом («откуда взята инфа») */
    .mes-sources { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    /* RLM: плеер озвучки под сообщением — играть/пауза, перемотка (нативный range: палец/мышь), перегенерация */
    .mes-tts-player { display: flex; align-items: center; gap: 10px; margin-top: 8px; max-width: 560px;
      padding: 6px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); }
    .mes-ttsp-btn { flex: 0 0 auto; width: 24px; height: 24px; padding: 0; font-size: 13px; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent;
      color: var(--SmartThemeBodyColor, #ddd); opacity: .85; transition: opacity .12s, color .12s; }
    .mes-ttsp-btn:hover { opacity: 1; color: var(--customThemeColor, #8ab); }
    .mes-ttsp-btn.busy { opacity: .35; pointer-events: none; }
    .mes-ttsp-time { flex: 0 0 auto; min-width: 78px; text-align: right; font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
    .mes-ttsp-seek { flex: 1 1 auto; -webkit-appearance: none; appearance: none; height: 5px; margin: 0; border-radius: 4px;
      background: rgba(255,255,255,.14); outline: none; cursor: pointer; }
    .mes-ttsp-seek::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; margin: 0;
      border: none; border-radius: 50%; background: var(--customThemeColor, #8ab); cursor: pointer; }
    .mes-ttsp-seek::-moz-range-thumb { width: 13px; height: 13px; border: none; border-radius: 50%; background: var(--customThemeColor, #8ab); cursor: pointer; }
    .mes-critic { margin-top: 8px; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 6px; display: inline-block; }
    .mes-critic.crit-ok { color: #bce6bc; border: 1px solid rgba(150,200,150,.55); background: rgba(150,200,150,.12); }
    .mes-critic.crit-bad { color: #f2bd80; border: 1px solid rgba(224,160,96,.6); background: rgba(224,160,96,.14); }
    /* Блок «Состояние» под сообщением (вместо плавающей панели) */
    .mes-state { margin-top: 8px; max-width: 560px; padding: 9px 13px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); font-size: 13px; }
    .mes-state-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .mes-state-t { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; opacity: .7; }
    .mes-roll-btn { display: inline-block; margin-top: 6px; font-size: 11px; padding: 4px 9px; border: 1px dashed rgba(255,255,255,.28); border-radius: 5px; color: #cbd5e1; cursor: pointer; }
    .mes-roll-btn:hover { color: var(--customThemeColor, #9ecbff); border-color: var(--customThemeColor, #9ecbff); }
    .mes-roll { margin-top: 6px; padding: 6px 9px; border-radius: 5px; border: 1px solid rgba(255,255,255,.2); font-size: 11px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .mes-roll.roll-ok { border-color: rgba(120,200,140,.5); }
    .mes-roll.roll-no { border-color: rgba(217,138,91,.55); }
    .mes-roll-t { font-weight: 600; }
    .mes-roll-d { color: #9aa5b1; }
    .mes-st-tr { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; line-height: 1; padding: 3px 7px; background: rgba(255,255,255,.06); color: #cbd5e1; border: 1px solid rgba(255,255,255,.28); border-radius: 4px; cursor: pointer; }
    .mes-st-tr:hover, .mes-st-tr.on { color: var(--customThemeColor, #9ecbff); border-color: var(--customThemeColor, #9ecbff); }
    .mes-st-row { display: flex; align-items: center; gap: 9px; margin: 4px 0; }
    .mes-st-name { flex: 0 0 auto; min-width: 84px; opacity: .92; }
    .mes-st-bar { flex: 1 1 auto; height: 7px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    .mes-st-fill { display: block; height: 100%; background: linear-gradient(90deg,#d98b6a,#d9c86a,#7ac07a); }
    .mes-st-val { flex: 0 0 auto; font-variant-numeric: tabular-nums; opacity: .95; }
    .mes-st-val.mes-st-wide { flex: 1 1 auto; text-align: right; }
    .mes-st-reason { font-style: italic; opacity: .78; font-size: 12px; margin: 2px 0 5px; }
    .mes-review { margin-top: 8px; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 6px; display: inline-block; cursor: pointer; color: #cdb2e6; border: 1px solid rgba(185,150,225,.5); background: rgba(185,150,225,.12); }
    .mes-review:hover { border-color: rgba(185,150,225,.9); }
    /* RLM: окно разбора критика — модалка (как окно правки сообщения), но ТОЛЬКО просмотр (реплику не меняет). */
    .crit-modal-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .crit-modal { display: flex; flex-direction: column; width: min(560px, 100%); max-height: 86vh;
      background: var(--SmartThemeBlurTintColor, #1b1719); border: 1px solid var(--customThemeColor, #8ab);
      border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.55); overflow: hidden; }
    .crit-modal-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,.08); }
    .crit-modal-title { flex: 1; font-size: 14px; font-weight: 600; opacity: .92; }
    .crit-modal-x { font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 7px; border-radius: 6px;
      color: color-mix(in srgb, var(--SmartThemeBodyColor, #889) 60%, transparent); }

<!-- ripplestyle = режим Moonlit с крупным аватаром (chat_display 6 у пользователя) -->
<body class="ripplestyle no_animation" style="background: transparent !important;">
  <div id="bg1"></div>
  <div id="sheld">
    <!-- Панель партии («коробка передач») — только в групповом режиме (данные от мультиплей-комплитера) -->
    <div id="rlm-party" style="display:none"></div>
    <!-- Экран «Вход в игру» — перед стартом группового чата (этапы: фантомы → стартовая сцена) -->
    <div id="rlm-entry" style="display:none"></div>
    <!-- Сообщения рисуются из данных (postMessage {type:'render'}); до первого render — демо-диалог -->
    <div id="chat"></div>

    <div id="rlm-zone">
      <div class="rlm-ctl">
        <div id="rlm-actions">
          <button class="rlm-act rlm-build" data-act="chronicle-build" type="button" title="Собрать сцену из отмеченной ►◄ разметки (с превью)" style="display:none;">Собрать сцену</button>
          <button class="rlm-act rlm-next" data-act="group-next" type="button" title="Следующий ход: ИИ отвечает сам (ранжиратор выбирает говорящего) — не дожидаясь твоей реплики" style="display:none;">⏭ След. ход</button>
          <button class="rlm-act rlm-auto" data-act="group-auto" type="button" title="Авто-ходы: ИИ ходит сам, пока ранжиратор не отдаст ход тебе. Нажми ещё раз — пауза (можно влезть самому)." style="display:none;">▶ Авто</button>
          <button class="rlm-act" data-act="newchat" type="button">Новый чат</button>
          <button class="rlm-act" data-act="regen" type="button">Перегенерировать</button>
          <button class="rlm-act" data-act="critic-run" type="button" title="Критик проверит последний ответ ИИ и при фальши перепишет">Критик</button>
          <button class="rlm-act rlm-del" data-act="del-mode" type="button" title="Режим удаления: выбери сообщение — оно и все ниже удалятся">🗑 Удалить</button>
        </div>
        <!-- RLM: лента статуса процесса ПЕРЕКРЫВАЕТ кнопки (текст этапа по центру + крестик отмены) -->
        <div id="rlm-proc" hidden><span class="rlm-proc-text"></span><span class="rlm-proc-x" title="Остановить процесс">✕</span></div>
      </div>
      <div id="rlm-proc-bar"><i></i></div>
    </div>

    <div id="form_sheld">
      <div id="send_form" class="no_connection">
        <div id="leftSendForm">
          <div class="fa-solid fa-wrench interactable" title="Инструменты"></div>
          <div class="fa-solid fa-list-ol interactable" title="Оглавление"></div>
          <div class="fa-solid fa-book rlm-lore-open interactable" title="Лорбук чата (открыть вижн)"></div>
          <div class="fa-solid fa-heart rlm-state-open interactable" title="Состояние (переменные — открыть вижн)"></div>
          <div class="fa-solid fa-bullseye rlm-objective-open interactable" title="Цель (задачи для ИИ — открыть вижн)"></div>
          <div class="fa-solid fa-video rlm-director-open interactable" title="Режиссёр (события сцены — открыть вижн)"></div>
          <div class="fa-solid fa-users rlm-guests-open interactable" title="Гости и визитёры (список — открыть/удалить)"></div>
          <div class="fa-solid fa-brain interactable" title="Память"></div>
          <div class="fa-solid fa-dice-d20 rlm-random-open interactable" title="Рандомайзер (честный кубик — открыть вижн)"></div>
        </div>

          <div id="rlm-tr-input" class="fa-solid fa-language interactable" title="Перевести ввод RU→EN (заменить)"></div>
