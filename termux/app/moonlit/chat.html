  </div>

  <script>
    // ---- Аватары-заглушки (тот же вид, что был в статике): тёплый ИИ / холодный юзер ----
    const AVA_CHAR = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 130%22%3E%3Crect width=%22100%22 height=%22130%22 fill=%22%232e2422%22/%3E%3Ccircle cx=%2250%22 cy=%2252%22 r=%2222%22 fill=%22%23e3cbb9%22/%3E%3Cpath d=%22M18 130C18 96 34 82 50 82s32 14 32 48z%22 fill=%22%23e3cbb9%22/%3E%3Cpath d=%22M26 52C26 26 50 24 50 24s24 2 24 28c0-12-12-16-24-16s-24 4-24 16z%22 fill=%22%234a2f28%22/%3E%3C/svg%3E";
    const AVA_USER = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 130%22%3E%3Crect width=%22100%22 height=%22130%22 fill=%22%2320262f%22/%3E%3Ccircle cx=%2250%22 cy=%2252%22 r=%2222%22 fill=%22%23c6cbd6%22/%3E%3Cpath d=%22M18 130C18 96 34 82 50 82s32 14 32 48z%22 fill=%22%23c6cbd6%22/%3E%3C/svg%3E";

    // Экранирование + разметка реплики как в SillyTavern: **жирный**, *действие*, "речь" (<q>).
    function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function fmt(text){
      return esc(text)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/&quot;/g, '"')
        .replace(/"([^"]*)"/g, '<q>$1</q>')
        .replace(/\n/g, '<br>');
    }

    let lastNames = { char: 'Персонаж', user: 'Ты' };
    let lastAvatars = {};       // аватары «долетают по проводам» из нод Персонаж/Персона
    let lastSlotAvatars = null;  // группа: карта «имя говорящего → аватар» (у каждой реплики — свой аватар)
    let lastStateDefs = [];     // определения переменных «Состояния» (для блока под сообщением); пусто = не показывать
    let lastStateNamesTr = {};  // перевод ИМЁН состояний (id → RU), общий кэш; используется при включённом переводе блока
    let currentMsgs = [];       // последний отрисованный список (для inline-правки — нужен сырой текст)
    let lastGroup = null;       // групповой чат: {started, scene} — пока !started, показываем экран «Вход в игру»
    let lastParty = null;       // партия (слоты) для экрана входа
    let sceneStart = null, sceneEnd = null;   // разметка сцены (как в MachineMechanic): начало/конец
    // Озвучка: готовый звук реплики idx → blob-URL. Живёт МЕЖДУ перерисовками (плеер под сообщением
    // рисуется из этой карты в mesHtml). _ttsAutoplayIdx — какую реплику проиграть сразу после рендера.
    const ttsAudioByIdx = {};
    let _ttsAutoplayIdx = null;

    // Плеер озвучки под сообщением: играть/пауза, перемотка (нативный range — тянется пальцем и мышью),
    // перегенерировать. Рисуется, только если для реплики уже готов звук (ttsAudioByIdx[i]).
    function ttsPlayerHtml(i){
      const a = ttsAudioByIdx[i];
      if (!a) return '';
      const cur = currentMsgs[i];
      if (!cur || (a.key != null && a.key !== cur.text)) return '';   // звук привязан к ТЕКСТУ реплики: перегенерили/правили → чужой плеер не показываем
      const url = a.url;
      return '<div class="mes-tts-player" data-ttsp="' + i + '">'
        + '<button type="button" class="mes-ttsp-btn mes-ttsp-play fa-solid fa-play interactable" title="Играть / пауза"></button>'
        + '<input type="range" class="mes-ttsp-seek" min="0" max="1000" value="0" step="1" title="Перемотка">'
        + '<span class="mes-ttsp-time">0:00 / 0:00</span>'
        + '<button type="button" class="mes-ttsp-btn mes-ttsp-regen fa-solid fa-rotate-right interactable" title="Перегенерировать озвучку"></button>'
        + '<audio class="mes-ttsp-audio" src="' + url + '" preload="metadata"></audio>'
        + '</div>';
    }
    // Оживить плееры озвучки после перерисовки: навесить события на каждый (элементы всегда свежие,
    // innerHTML их пересоздаёт). Перемотка — нативный <input type=range> (палец/мышь). В конце — автозапуск
    // той реплики, что только что озвучилась (_ttsAutoplayIdx).
    function wireTtsPlayers(){
      const fmtT = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
      const fill = (el, p) => { el.style.background = 'linear-gradient(90deg, var(--customThemeColor,#8ab) ' + p + '%, rgba(255,255,255,.14) ' + p + '%)'; };
      document.querySelectorAll('.mes-tts-player').forEach((pl) => {
        const audio = pl.querySelector('.mes-ttsp-audio');
        const playB = pl.querySelector('.mes-ttsp-play');
        const seek = pl.querySelector('.mes-ttsp-seek');
        const timeEl = pl.querySelector('.mes-ttsp-time');
        const regenB = pl.querySelector('.mes-ttsp-regen');
        const idx = Number(pl.dataset.ttsp);
        let seeking = false;
        const paint = () => {
          const d = audio.duration || 0, c = audio.currentTime || 0;
          const p = d ? (c / d * 100) : 0;
          if (!seeking) { seek.value = String(Math.round(p * 10)); fill(seek, p); }
          timeEl.textContent = fmtT(c) + ' / ' + fmtT(d);
        };
        playB.addEventListener('click', (e) => { e.stopPropagation(); if (audio.paused) audio.play().catch(() => {}); else audio.pause(); });
        const toPlay = () => { playB.classList.remove('fa-pause'); playB.classList.add('fa-play'); };
        const toPause = () => { playB.classList.remove('fa-play'); playB.classList.add('fa-pause'); };
        audio.addEventListener('play', toPause);
        audio.addEventListener('pause', toPlay);
        audio.addEventListener('ended', () => { toPlay(); });
        audio.addEventListener('loadedmetadata', paint);
        audio.addEventListener('timeupdate', paint);
        // перемотка: во время тяги показываем цель, отпустили — прыгаем (палец на телефоне, мышь на ПК)
        seek.addEventListener('click', (e) => e.stopPropagation());
        seek.addEventListener('input', () => {
          seeking = true; const d = audio.duration || 0, p = Number(seek.value) / 10;
          fill(seek, p); timeEl.textContent = fmtT(d * p / 100) + ' / ' + fmtT(d);
        });
        seek.addEventListener('change', () => { const d = audio.duration || 0; audio.currentTime = d * (Number(seek.value) / 1000); seeking = false; paint(); });
        regenB.addEventListener('click', (e) => {
          e.stopPropagation();
          const mm = currentMsgs[idx];
          const shown = mm ? ((mm._showTr && mm._tr != null) ? mm._tr : mm.text) : '';
          regenB.classList.add('busy');
          parent.postMessage({ type: 'tts', idx: idx, text: shown }, '*');   // тот же путь, что и 🔊 — придёт новый звук
        });
        paint();
      });
      if (_ttsAutoplayIdx != null) {   // только что озвучили — проиграть сразу (клик по 🔊/перегенерации ещё «активен» в кадре → autoplay разрешён)
        const pl = document.querySelector('.mes-tts-player[data-ttsp="' + _ttsAutoplayIdx + '"]');
        _ttsAutoplayIdx = null;
        if (pl) { const a = pl.querySelector('.mes-ttsp-audio'); if (a) a.play().catch(() => {}); }
      }
    }

    // Теги-источники под ответом: откуда взята инфа (сработавшие записи лорбука/памяти).
    function sourcesHtml(m){
      if (!m.sources || !m.sources.length) return '';
      return '<div class="mes-sources">' + m.sources.map(function(s){
        return '<span class="mes-src" title="' + esc(s.kind) + '">' + esc(s.kind) + ': ' + esc(s.name) + '</span>';
      }).join('') + '</div>';
    }
    // Метка вердикта критика под репликой. Переписанное → бейдж «Апрув редактора» ТОЛЬКО у последнего
    // сообщения (клик — разбор: было / рассуждение / стало); принятое (ручной режим) → зелёная метка.
    function criticHtml(m, isLast){
      if (m.criticReview) return isLast ? '<div class="mes-review interactable" data-review="1">⚖ Апрув редактора ▸</div>' : '';
      if (!m.critic) return '';
      const c = m.critic;
      if (c.ok) return '<div class="mes-critic crit-ok interactable" data-approve="1">⚖ Критик: апрув ✓ ▸</div>';   // клик → почему одобрил + фидбек
      return '<div class="mes-critic crit-bad">' + esc('⚖ Критик переписал: ' + (c.reason || 'не в характере')) + '</div>';
    }
    // Блок «Состояние» ПОД сообщением (вместо плавающей панели): значения на этот ход + причины изменений.
    // Рисуем на каждом ответе ИИ, где есть снимок (_state); пусто lastStateDefs / user / pending → скрыт.
    function stateHtml(m, i){
      if (m.role === 'user' || m.pending || !m._state || !lastStateDefs.length) return '';
      const vals = m._state;
      const showTr = !!(m._showStateTr && m._stateRtr);
      const reasons = showTr ? m._stateRtr : (m._stateR || {});   // причины: перевод (из кэша) или оригинал
      const rows = lastStateDefs.map(function(v){
        const val = vals[v.id];
        if (val === undefined || val === null) return '';
        const nameTxt = (showTr && lastStateNamesTr[v.id]) ? lastStateNamesTr[v.id] : v.name;   // имя состояния: перевод (если включён) или оригинал
        let valTxt;
        if (v.type === 'list') valTxt = (Array.isArray(val) && val.length) ? val.join(', ') : '(пусто)';
        else if (v.type === 'bool') valTxt = val ? 'да' : 'нет';
        else valTxt = String(val);
        let row;
        if (v.type === 'int' && isFinite(v.min) && isFinite(v.max) && v.max > v.min) {
          const pct = Math.max(0, Math.min(100, Math.round(((val - v.min) / (v.max - v.min)) * 100)));
          row = '<div class="mes-st-row"><span class="mes-st-name">' + esc(nameTxt) + '</span><span class="mes-st-bar"><span class="mes-st-fill" style="width:' + pct + '%"></span></span><span class="mes-st-val">' + esc(valTxt) + '</span></div>';
        } else {
          row = '<div class="mes-st-row"><span class="mes-st-name">' + esc(nameTxt) + '</span><span class="mes-st-val mes-st-wide">' + esc(valTxt) + '</span></div>';
        }
        const rt = reasons[v.id];
        return row + (rt ? '<div class="mes-st-reason">' + esc(rt) + '</div>' : '');
      }).join('');
      if (!rows) return '';
      const hasReasons = m._stateR && Object.keys(m._stateR).length;
      const trBtn = hasReasons ? '<span class="mes-st-tr interactable' + (showTr ? ' on' : '') + '" data-st-tr="' + i + '" title="Перевести причины на русский (повторно — оригинал)">RU</span>' : '';
      return '<div class="mes-state"><div class="mes-state-hd"><span class="mes-state-t">🎛 Состояние</span>' + trBtn + '</div>' + rows + '</div>';
    }

    // «Раскрыть вероятность» ПОД последним ответом ИИ: игрок забирает ближайший исход СЕБЕ —
    // модели он уже не достанется (ей уйдёт следующий). Раскрыл — отыгрывай честно в своём ходу.
    let randomOn = false;   // включён ли «Рандомайзер» (сообщает renderer вместе с логом)
    function randomHtml(m, i, isLast){
      if (m.role === 'user' || m.pending || !isLast || !randomOn) return '';
      if (m._peek) {
        const ok = m._peek === 'success';
        return '<div class="mes-roll ' + (ok ? 'roll-ok' : 'roll-no') + '">'
          + '<span class="mes-roll-t">' + (ok ? '🎲 Успех' : '🎲 Провал') + '</span>'
          + '<span class="mes-roll-d">' + (ok ? 'то, что ты сейчас попробуешь, — получится: этот же бросок уйдёт с твоим ходом. Отыграй его.' : 'то, что ты сейчас попробуешь, — не выйдет: этот же бросок уйдёт с твоим ходом. Отыграй его.') + '</span>'
          + '</div>';
      }
      return '<div class="mes-roll-btn interactable" data-roll-peek="' + i + '" title="Подсмотреть бросок, который уйдёт с твоим ходом — чтобы отыграть его самому. Ничего не тратит.">🎲 Раскрыть вероятность</div>';
    }

    // Выбор первого сообщения ‹ › — ТОЛЬКО на приветствии и ТОЛЬКО пока ролка не началась (одно сообщение
    // в чате) и заготовок больше одной. Как в ST-свайпе, но без генерации: переключаем готовые приветствия.
    function greetNavHtml(m, i){
      if (!(m && m.greeting && i === 0 && currentMsgs.length === 1 && Array.isArray(m.swipes) && m.swipes.length > 1)) return '';
      const gi = Number.isInteger(m.swipeIdx) ? m.swipeIdx : 0;
      return '<div class="rlm-greet-nav" title="Первое сообщение — выбери, с какого начать ролку">'
        + '<button class="rlm-greet-arrow" type="button" data-greet-dir="-1" title="Предыдущее">‹</button>'
        + '<span class="rlm-greet-count">' + (gi + 1) + ' / ' + m.swipes.length + '</span>'
        + '<button class="rlm-greet-arrow" type="button" data-greet-dir="1" title="Следующее">›</button>'
        + '</div>';
    }
    // Одно сообщение → разметка ST (.mes). role: 'char' | 'user'.
    function mesHtml(m, i){
      const isUser = m.role === 'user';
      // Группа: рассказчик (m._narr; фолбэк — имя совпало со слотом-рассказчиком) → проза без имени/аватара;
      //         активный говорящий («на передаче» по партии) → имя+аватар золотым, остальные нейтральны.
      const members = (lastParty && Array.isArray(lastParty.members)) ? lastParty.members : null;
      const narrName = members ? ((members.find(x => x.narr) || {}).name || null) : null;
      const isNarr = !isUser && (!!m._narr || (!!m._speaker && narrName && m._speaker === narrName));
      const activeMem = members ? members.find(x => x.active) : null;
      const activeName = (activeMem && !activeMem.narr) ? activeMem.name : null;
      const isActiveSpeaker = !isUser && !isNarr && !!m._speaker && !!activeName && m._speaker === activeName;
      // Группа: у реплики свой говорящий (m._speaker) — его имя над репликой (иначе общее имя карточки).
      const name = isUser ? (lastNames.user || 'Ты') : (m._speaker || lastNames.char || 'Персонаж');
      // Группа: аватар — у КАЖДОЙ реплики свой (по говорящему m._speaker), иначе общий активного «лагает» на всех.
      const ava = isUser ? (lastAvatars.user || AVA_USER)
        : ((lastSlotAvatars && m._speaker && lastSlotAvatars[m._speaker]) || lastAvatars.char || AVA_CHAR);
      const time = m.time ? esc(m.time) : '';
      const lo = (sceneStart != null && sceneEnd != null) ? Math.min(sceneStart, sceneEnd) : null;
      const hi = (sceneStart != null && sceneEnd != null) ? Math.max(sceneStart, sceneEnd) : null;
      const inScene = (lo != null && i >= lo && i <= hi);
      const shownText = m.pending ? '…' : ((m._showTr && m._tr != null) ? m._tr : m.text);   // pending — держим «…», пока авто-критик проверяет (без мелькания)
      return '<div class="mes' + (inScene ? ' stmb-in-scene' : '') + (m.chrHidden ? ' mes-ghost' : '') + (isNarr ? ' mes-narr' : '') + (isActiveSpeaker ? ' mes-active-speaker' : '') + '" is_user="' + isUser + '" ch_name="' + esc(name) + '" mesid="' + i + '" swipeid="0" '
        + 'style="--mes-avatar-url: url(\'' + ava + '\');">'
        + (isNarr ? '' : ('<div class="mesAvatarWrapper"><div class="avatar"><img src="' + ava + '" /></div>'
        + '<div class="mesIDDisplay">#' + i + '</div></div>'))
        + '<div class="mes_block">'
        // Подпись сцены (Хроника) — всегда вверху сообщения, если оно уже свёрнуто в запись
        + (m.chrScene ? '<div class="mes-scene-tag" title="Сцена, в которую свёрнуто это сообщение (Хроника)">🗒 ' + esc(m.chrScene.name || ('Сцена ' + (m.chrScene.num || ''))) + '</div>' : '')
        + '<div class="ch_name flex-container justifySpaceBetween">'
        + '<div class="flex-container flex1 alignitemscenter">'
        + '<div class="flex-container alignItemsBaseline">'
        // Каретки старт ▶ / конец ◀ — ВНУТРИ самого имени (инлайн), чтобы флекс Moonlit (order/wrap/justify) их не отрывал
        + '<span class="name_text">' + (isNarr ? '' : esc(name))
        + ' <span class="mes-scene-start fa-solid fa-caret-right' + (sceneStart === i ? ' on' : '') + ' interactable" title="Отметить начало сцены" data-scene-start="' + i + '"></span>'
        + '<span class="mes-scene-end fa-solid fa-caret-left' + (sceneEnd === i ? ' on' : '') + ' interactable" title="Отметить конец сцены" data-scene-end="' + i + '"></span>'
        + (m.chrHidden ? '<span class="mes-ghost-ic" title="Свёрнуто в Хронику — не идёт в контекст модели">👻</span>' : '')
        + '</span>'
        + '<small class="timestamp">' + time + '</small>'
        + '</div>'
        + '</div>'
        + '<div class="mes_buttons">'
        // ⑃ Ветка — на КАЖДОМ сообщении (вверху, в шапке): новый чат-копия истории ДО этого места (родитель: branch)
        + '<div class="mes_button mes-branch fa-solid fa-code-branch interactable" title="Ветка: новый чат — копия истории до этого сообщения" data-branch="' + i + '"></div>'
        // Весь ряд — иконки FontAwesome (единый шрифт → одинаковый размер и базовая линия; без эмодзи, что разъезжались)
        // ↻ — только на ПОСЛЕДНЕМ ответе ИИ (как в ST: перегенерируется последняя реплика)
        + ((!isUser && i === currentMsgs.length - 1) ? '<div class="mes_button mes-regen fa-solid fa-rotate-right interactable" title="Перегенерировать этот ответ" data-regen="1"></div>' : '')
        + (!isUser ? '<div class="mes_button mes-fb fa-solid fa-comment-dots interactable" title="Фидбек: переписать этот ответ по замечанию" data-fb="' + i + '"></div>' : '')
        + '<div class="mes_button fa-solid fa-language mes-tr' + (m._showTr ? ' on' : '') + ' interactable" title="Перевести EN→RU (повторно — оригинал)" data-translate="' + i + '"></div>'
        + '<div class="mes_button mes-tts fa-solid fa-volume-high interactable" title="Озвучить (нода «Озвучка»)" data-tts="' + i + '"></div>'
        + '<div class="mes_button fa-solid fa-pencil interactable" title="Редактировать" data-edit="' + i + '"></div>'
        + '<div class="mes_button mes-del fa-solid fa-xmark interactable" title="Удалить это сообщение" data-del="' + i + '"></div>'
        + '</div></div>'
        + '<div class="mes_text">' + fmt(shownText) + '</div>'
        + greetNavHtml(m, i)
        + ttsPlayerHtml(i)
        + sourcesHtml(m)
        + criticHtml(m, i === currentMsgs.length - 1)
        + stateHtml(m, i)
        + randomHtml(m, i, i === currentMsgs.length - 1)
        + '</div></div>';
    }

    // Панель партии («коробка передач») над чатом. data = { active, members:[{name,active}] } или null.
    // Нет данных → панель скрыта (обычный одиночный чат). Активный слот подсвечен, пустой — пунктиром.
    function renderParty(data){
      const bar = document.getElementById('rlm-party');
      if (!bar) return;
      if (!data || !Array.isArray(data.members) || !data.members.length){ bar.style.display='none'; bar.innerHTML=''; return; }
      const chip = (m,i) => {
        const empty = !m.name;
        const nm = m.name || ('Слот '+(i+1));
        const ava = m.narr ? '✎' : (m.name ? m.name.slice(0,1) : '＋');
        const tag = m.active ? 'на передаче' : (m.narr ? 'рассказчик' : (empty ? 'пусто' : 'фантом'));
        // Клик по чипу → память ЭТОГО слота (его Душа); пустой слот не кликаем.
        return '<div class="rp-chip '+(m.active?'on':'')+' '+(empty?'empty':'')+' '+(m.narr?'narr':'')+'"'
          + (empty?'':' data-party-idx="'+i+'" title="Открыть память: '+esc(nm)+'"')+'>'
          + '<span class="rp-ava">'+ava+'</span>'
          + '<span class="rp-w"><span class="rp-nm">'+esc(nm)+'</span><span class="rp-tag">'+tag+'</span></span></div>';
      };
      const active = data.members.find(x => x.active);
      const turn = active && active.name ? active.name : '—';
      bar.innerHTML = '<div class="rp-h">Коробка передач · <b>ход: '+turn+'</b> <span class="rp-hint">клик по нику — его память</span></div>'
        + '<div class="rp-row">'+data.members.map(chip).join('')+'</div>';
      bar.style.display='';
    }
    // Клик по чипу партии → открыть память ЭТОГО слота (его Душа). Делегирование: #rlm-party живёт, меняется только innerHTML.
    (function(){ const bar = document.getElementById('rlm-party'); if (bar) bar.addEventListener('click', (e) => { const c = e.target.closest('.rp-chip[data-party-idx]'); if (c) parent.postMessage({ type:'party-soul', idx: Number(c.dataset.partyIdx) }, '*'); }); })();

    // Экран «Вход в игру»: показывается в групповом чате, пока игра не начата (group && !group.started).
    // Пишешь завязку → «Начать игру» → этапы (фантомы по персонажу → стартовая сцена) → открывается чат.
    function renderGroupEntry(group, party){
      const box = document.getElementById('rlm-entry');
      const chat = document.getElementById('chat');
      const form = document.getElementById('form_sheld');
      if (!box) return;
      const show = !!(group && !group.started);
      box.style.display = show ? '' : 'none';
      if (chat) chat.style.display = show ? 'none' : '';
      if (form) form.style.display = show ? 'none' : '';
      if (!show) return;
      const members = (party && Array.isArray(party.members)) ? party.members : [];
      const chips = members.map((m,i) => {
        const nm = m.name || ('Слот '+(i+1));
        const ava = m.narr ? '✎' : (m.name ? m.name.slice(0,1) : '＋');
        const cls = 'ge-chip'+(m.name?'':' empty')+(m.narr?' narr':'');
        return '<div class="'+cls+'"><span class="ge-ava">'+esc(ava)+'</span><span class="ge-nm">'+esc(nm)+(m.narr?' · рассказчик':'')+'</span></div>';
      }).join('');
      const named = members.filter(m => m.name && !m.narr).length;   // персонажи с картой (без рассказчика)
      // Не пересобираем, если уже показан и идёт подготовка (чтобы не стереть прогресс/ввод).
      if (box.dataset.built === '1' && box.querySelector('.ge-progress.active')) return;
      box.innerHTML =
        '<div class="ge-box">'
        + '<div class="ge-title">🎬 Вход в игру</div>'
        + '<div class="ge-sub">Групповая сцена. Опиши завязку — где всё начинается — и запусти подготовку: Рассказчик познакомится с каждым (по одному за ход), затем откроет сцену.</div>'
        + '<div class="ge-party-h">Партия · '+named+' персонаж'+(named===1?'':(named>=2&&named<=4?'а':'ей'))+'</div>'
        + '<div class="ge-party">'+(chips||'<span class="ge-empty">Нет персонажей — подключи карточки в слоты мультиплей-комплитера</span>')+'</div>'
        + '<div class="ge-scene-hd"><label class="ge-scene-l">Завязка / первая сцена</label>'
        +   '<button type="button" class="ge-tr" title="Перевести завязку RU→EN (модель понимает англ. лучше)">🌐 RU→EN</button></div>'
        + '<textarea class="ge-scene" spellcheck="false" placeholder="напр.: Таверна на краю болот, поздний вечер, гроза. Партия только что укрылась от дождя…">'+esc((group&&group.scene)||'')+'</textarea>'
        + '<label class="ge-expand-l" title="Вкл — Рассказчик распишет обстоятельства по твоей завязке. Выкл — твоя завязка станет первым сообщением КАК ЕСТЬ (без переписывания).">'
        +   '<input type="checkbox" class="ge-expand" checked> Дописать сцену Рассказчиком <span class="ge-expand-hint">(выкл — завязка как есть, без переписывания)</span>'
        + '</label>'
        + '<button class="ge-start" type="button"'+(named?'':' disabled')+'>Начать игру</button>'
        + '<div class="ge-progress"></div>'
        + '</div>';
      box.dataset.built = '1';
      const startBtn = box.querySelector('.ge-start');
      const sceneTa = box.querySelector('.ge-scene');
      if (startBtn) startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        startBtn.disabled = true; startBtn.textContent = 'Готовим…';
        const prog = box.querySelector('.ge-progress'); if (prog) prog.classList.add('active');
        const expandCb = box.querySelector('.ge-expand');
        parent.postMessage({ type: 'group-start', scene: (sceneTa && sceneTa.value || '').trim(), expand: expandCb ? !!expandCb.checked : true }, '*');
      });
      // Перевод завязки RU→EN (замена) — тот же движок, что у поля ввода (нода Транслитер), ответ в 'entry-translated'.
      const trBtn = box.querySelector('.ge-tr');
      if (trBtn) trBtn.addEventListener('click', () => {
        if (!sceneTa || !sceneTa.value.trim() || trBtn.classList.contains('busy')) return;
        trBtn.classList.add('busy'); trBtn.textContent = '…';
        parent.postMessage({ type: 'translate-entry', text: sceneTa.value }, '*');
      });
    }
    // Кнопка Авто/Пауза: on=true → идёт авто-прокрутка ходов (⏸ Пауза), on=false → ▶ Авто.
    function setAutoBtn(on){ const b = document.querySelector('.rlm-auto'); if (!b) return; b.classList.toggle('on', !!on); b.textContent = on ? '⏸ Пауза' : '▶ Авто'; }
    // Прогресс подготовки (этапы фантомов/сцены) — приходит из RLM ({type:'group-prep'}).
    function groupPrepUpdate(m){
      const box = document.getElementById('rlm-entry');
      const prog = box && box.querySelector('.ge-progress');
      if (!prog) return;
      prog.classList.add('active');
      const cls = m.stage === 'error' ? 'ge-p-err' : (m.stage === 'done' ? 'ge-p-done' : 'ge-p-run');
      prog.innerHTML = '<div class="ge-p-line '+cls+'"><span class="ge-p-dot"></span><span class="ge-p-txt">'+esc(m.text||'')+'</span></div>'
        + '<div class="ge-p-bar"><i style="width:'+Math.round((m.frac!=null?m.frac:(m.stage==='done'?1:0.15))*100)+'%"></i></div>';
      if (m.stage === 'error') {
        const b = box.querySelector('.ge-start'); if (b) { b.disabled = false; b.textContent = 'Начать игру'; }
      }
    }

    // Перерисовать весь диалог из массива сообщений.
    let _renderedCount = 0;   // сколько сообщений было в прошлой отрисовке (для «камера сразу внизу»)
    function renderMessages(msgs){
      currentMsgs = msgs || [];
      const chat = document.getElementById('chat');
      if (!chat) return;
      // «Прилипание к низу»: держим низ ТОЛЬКО если пользователь и так был внизу (новое сообщение).
      // Если прокрутил вверх (читает/переводит старое сообщение) — сохраняем позицию, не дёргаем вниз.
      const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
      const prevTop = chat.scrollTop;
      // Открыли чат / подгрузили всю историю разом (было пусто, или список прыгнул больше чем на 1) —
      // ставим камеру СРАЗУ ВНИЗ, к последнему сообщению, а не оставляем вверху.
      const prevCount = _renderedCount; _renderedCount = currentMsgs.length;
      const forceBottom = (prevCount === 0 && currentMsgs.length > 0) || Math.abs(currentMsgs.length - prevCount) > 1;
      chat.innerHTML = currentMsgs.map((m, i) => mesHtml(m, i)).join('');
      wireTtsPlayers();                                     // оживить плееры озвучки (innerHTML пересоздал их)
      if (window.__stmbHideClip) window.__stmbHideClip();   // старое выделение исчезло — убрать кнопку Clip
      const bb = document.getElementById('rlm-actions') && document.querySelector('.rlm-build');
      if (bb) bb.style.display = (sceneStart != null && sceneEnd != null) ? '' : 'none';  // «Собрать главу» — только при отмеченной сцене ►◄
      const grpOn = (lastParty && Array.isArray(lastParty.members) && lastParty.members.length && lastGroup && lastGroup.started);
      const nb = document.querySelector('.rlm-next');   // «След. ход» — только в группе, когда игра начата
      if (nb) nb.style.display = grpOn ? '' : 'none';
      const ab = document.querySelector('.rlm-auto');   // «Авто/Пауза» — там же
      if (ab) { ab.style.display = grpOn ? '' : 'none'; setAutoBtn(lastGroup && lastGroup.auto); }
      updateSceneHint();   // подсказка «отметь конец/начало» выводится из состояния меток → переживает любую перерисовку (в т.ч. прыжки по Оглавлению)
      const toBottom = () => { chat.scrollTop = chat.scrollHeight; };
      requestAnimationFrame(() => {
        chat.scrollTop = (forceBottom || nearBottom) ? chat.scrollHeight : prevTop;
        // высота растёт после подгрузки аватарок/шрифтов — до тех пор дожимаем низ
        if (forceBottom) { setTimeout(toBottom, 60); setTimeout(toBottom, 250); setTimeout(toBottom, 600); }
      });
    }
    // Чат стартует ПУСТЫМ — наполняется только из render (приветствие карточки / диалог).
    renderMessages([]);

    // ---- Приём команд из RLM через postMessage (надёжно при file://) ----
    window.addEventListener('message', (e) => {
      const m = e.data || {};
      const de = document.documentElement;
      if (m.type === 'var') { m.value == null ? de.style.removeProperty(m.name) : de.style.setProperty(m.name, m.value); }
      else if (m.type === 'mode') { document.body.className = 'no_animation ' + m.value; }
      else if (m.type === 'css') {
        let s = document.getElementById(m.id);
        if (!m.css) { if (s) s.remove(); }
        else { if (!s) { s = document.createElement('style'); s.id = m.id; document.head.appendChild(s); } s.textContent = m.css; }
      }
      else if (m.type === 'bg') { const b = document.getElementById('bg1'); if (b) b.style.backgroundImage = m.url ? "url('" + m.url + "')" : ''; }
      else if (m.type === 'transparent') { de.style.background = m.on ? 'transparent' : ''; document.body.style.background = m.on ? 'transparent' : '#14100f'; }
      else if (m.type === 'render') { if (m.names) lastNames = m.names; if (m.avatars) lastAvatars = m.avatars; lastSlotAvatars = m.slotAvatars || null; if (m.stateDefs) lastStateDefs = m.stateDefs; lastGroup = m.group || null; lastParty = m.party || null; renderParty(m.party); if (m.group && !m.group.started) { document.getElementById('rlm-entry').dataset.built = ''; } renderGroupEntry(m.group, m.party); randomOn = !!m.randomOn; renderMessages(m.msgs); }
      else if (m.type === 'group-prep') { groupPrepUpdate(m); }
      else if (m.type === 'group-auto-state') { setAutoBtn(m.on); }
      else if (m.type === 'mes-translated') { const mm = currentMsgs[m.idx]; if (mm) { if (m.text != null) { mm._tr = m.text; mm._showTr = true; } renderMessages(currentMsgs); } }
      else if (m.type === 'roll-peeked') { const mm = currentMsgs[m.idx]; if (mm) { mm._peek = m.roll; renderMessages(currentMsgs); } }
      else if (m.type === 'st-translated') { const mm = currentMsgs[m.idx]; if (mm) { if (m.reasons) { mm._stateRtr = m.reasons; mm._showStateTr = true; } if (m.names) lastStateNamesTr = m.names; renderMessages(currentMsgs); } }
      else if (m.type === 'input-translated') { if (window.trBusyClear) window.trBusyClear(); const b = document.getElementById('rlm-tr-input'); if (b) b.classList.remove('busy'); if (ta && m.text != null) { ta.value = m.text; fit(); } }
      else if (m.type === 'entry-translated') { const box = document.getElementById('rlm-entry'); const sc = box && box.querySelector('.ge-scene'); const tb = box && box.querySelector('.ge-tr'); if (tb) { tb.classList.remove('busy'); tb.textContent = '🌐 RU→EN'; } if (sc && m.text != null) sc.value = m.text; }
      else if (m.type === 'review-translated') {   // перевод разбора «Апрув редактора» пришёл — подменить тексты в открытом окне
        const back = document.getElementById('rlm-crit-modal'); if (!back || Number(back.dataset.idx) !== m.idx) return;
        const keys = ['reason'];   // в окне апрува осталась одна секция — разбор судьи
        (m.texts || []).forEach((tx, i) => { const el = back.querySelector('.mrp-t[data-mrp="' + keys[i] + '"]'); if (el && tx != null) el.textContent = tx; });
        const tb = back.querySelector('[data-review-tr]'); if (tb) tb.textContent = '🌐 переведено';
      }
      else if (m.type === 'approve-translated') {   // перевод ОТВЕТА критика пришёл — вписать в окно (обратимо через dataset)
        const back = document.getElementById('rlm-crit-modal'); if (!back || Number(back.dataset.idx) !== m.idx) return;
        const cell = back.querySelector('.mrp-t[data-mrp="reason"]'); if (!cell) return;
        if (m.text != null) { cell.dataset.trText = m.text; cell.textContent = m.text; cell.dataset.trShown = '1'; }
        const btn = back.querySelector('.crit-tr-reason'); if (btn) { btn.classList.remove('busy'); btn.classList.add('on'); }
      }
      else if (m.type === 'fb-translated') {   // перевод ТВОЕГО текста в поле фидбека пришёл — заменить
        const back = document.getElementById('rlm-crit-modal'); if (!back) return;
        back.querySelectorAll('.crit-tr-fb').forEach((b) => b.classList.remove('busy'));
        const ta2 = back.querySelector('.crit-approve-fb'); if (ta2 && m.text != null) ta2.value = m.text;
      }
      else if (m.type === 'tts-busy') {   // спиннер на кнопке 🔊 сообщения + кнопке перегенерации плеера (полоса/текст этапа идут через 'proc')
        if (m.all) { document.querySelectorAll('.mes-tts.busy, .mes-ttsp-regen.busy').forEach((b) => b.classList.remove('busy')); }
        else {
          const b = document.querySelector('[data-tts="' + m.idx + '"]'); if (b) b.classList.toggle('busy', !!m.on);
          const r = document.querySelector('.mes-tts-player[data-ttsp="' + m.idx + '"] .mes-ttsp-regen'); if (r) r.classList.toggle('busy', !!m.on);
        }
      }
      else if (m.type === 'tts-audio') {   // готовый звук реплики → показать плеер под сообщением (и проиграть сразу)
        try {
          const cur = currentMsgs[m.idx];
          if (m.key != null && cur && cur.text !== m.key) { /* реплику уже перегенерили/правили пока озвучивалось — звук не наш, выбрасываем */ }
          else {
            const old = ttsAudioByIdx[m.idx]; if (old && old.url) URL.revokeObjectURL(old.url);
            const bytes = Uint8Array.from(atob(m.audioB64), (c) => c.charCodeAt(0));
            ttsAudioByIdx[m.idx] = { url: URL.createObjectURL(new Blob([bytes], { type: m.mime || 'audio/wav' })), key: (m.key != null ? m.key : (cur ? cur.text : null)) };
            _ttsAutoplayIdx = m.idx;
            renderMessages(currentMsgs);
          }
        } catch (e) { /* битый звук — молча пропустим */ }
      }
      else if (m.type === 'proc') { if (window.rlmProc) window.rlmProc(m); }   // лента статуса процесса
      else if (m.type === 'reset') {
        de.removeAttribute('style');
        document.querySelectorAll('style[id^="opt-"],style[id^="raw-"]').forEach((x) => x.remove());
        const b = document.getElementById('bg1'); if (b) b.style.backgroundImage = '';
        document.body.className = 'no_animation ripplestyle';
      }
      else if (m.type === 'scroll-to') {   // из «Оглавления»: прокрутить к сообщению сцены + подсветить
        const el = document.querySelector('.mes[mesid="' + m.idx + '"]');
        const chat = document.getElementById('chat');
        if (el && chat) {
          // Скроллим ТОЛЬКО контейнер #chat (а не scrollIntoView) — иначе в ноде браузер тянет
          // сам iframe в видимую область родителя и дёргает холст/шапку. Центрируем сообщение вручную.
          const er = el.getBoundingClientRect(), cr = chat.getBoundingClientRect();
          const top = chat.scrollTop + (er.top - cr.top) - (chat.clientHeight - er.height) / 2;
          chat.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
          el.classList.add('stmb-flash'); setTimeout(() => el.classList.remove('stmb-flash'), 1400);
        }
      }
    });

    // ---- Поле ввода: растёт при переносах + отправка наружу (в RLM) ----
    const ta = document.getElementById('send_textarea');
    const fit = () => { if (!ta) return; ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; };
    function sendNow(){
      if (!ta) return;
      const t = ta.value.trim();
      if (!t) return;
      parent.postMessage({ type: 'send', text: t }, '*');
      ta.value = ''; fit();
    }
    if (ta) {
      ta.addEventListener('input', fit); fit();
      ta.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.shiftKey) return;
        // Телефон/узкий экран (touch или ≤820px): Enter = ПЕРЕНОС СТРОКИ (не перехватываем). Отправка — только кнопкой ✈.
        const mobile = window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(max-width: 820px)').matches;
        if (mobile) return;
        e.preventDefault(); sendNow();   // десктоп: Enter отправляет (Shift+Enter — перенос)
      });
    }
    const sendBut = document.getElementById('send_but');
    if (sendBut) sendBut.addEventListener('click', sendNow);

    // ---- Кнопки «Новый чат» / «Перегенерировать» → наружу в RLM ----
    const actions = document.getElementById('rlm-actions');
    // Режим удаления (как в ST): 🗑 включает режим → клик по сообщению удаляет ЕГО и все НИЖЕ.
    let delMode = false;
    function setDelMode(on) {
      delMode = on;
      const c = document.getElementById('chat'); if (c) c.classList.toggle('del-mode', on);
      const b = document.querySelector('.rlm-del'); if (b) b.classList.toggle('on', on);
    }
    if (actions) actions.addEventListener('click', (e) => {
      const btn = e.target.closest('.rlm-act'); if (!btn) return;
      if (btn.dataset.act === 'del-mode') { setDelMode(!delMode); return; }   // локально в кадре чата
      parent.postMessage({ type: btn.dataset.act }, '*');
    });
    // Клик по сообщению в режиме удаления (capture — перехват ДО кнопок сообщения): обрезать _msgs с этого места.
    document.getElementById('chat').addEventListener('click', (e) => {
      if (!delMode) return;
      const mes = e.target.closest('.mes'); if (!mes) return;
      e.stopPropagation(); e.preventDefault();
      const idx = Number(mes.getAttribute('mesid')); if (isNaN(idx)) return;
      const cnt = currentMsgs.length - idx;
      if (window.confirm('Удалить это сообщение и все ниже (' + cnt + ' шт.)?')) {
        parent.postMessage({ type: 'delete-from', idx: idx }, '*');
      }
      setDelMode(false);
    }, true);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && delMode) setDelMode(false); });

    // ---- Лента статуса процесса: движок полос (озвучка/душа/хроника/критик/генерация) ----
    // Полосы рисуем через setInterval (реально движутся). Родитель шлёт {type:'proc', state, text, frac, cancelable}.
    // Ошибки идут НЕ сюда, а в верхний chatToast; сюда — только ход процесса и его финал.
    (function(){
      const zoneActions = document.getElementById('rlm-actions');
      const proc  = document.getElementById('rlm-proc');
      const ptext = proc && proc.querySelector('.rlm-proc-text');
      const px    = proc && proc.querySelector('.rlm-proc-x');
      const bar   = document.getElementById('rlm-proc-bar');
      const fill  = bar && bar.querySelector('i');
      if (!proc || !bar || !fill) return;
      const ACC = 'var(--customThemeColor,#51a0de)';
      let anim = null, hideT = null, mode = null, pendingScene = null;   // mode: 'proc' | 'scene'; pendingScene — подсказка сцены ждёт, пока процесс освободит ленту
      const stop = () => { if (anim) { clearInterval(anim); anim = null; } };
      function barOff(){ stop(); fill.style.transition='none'; fill.style.opacity='0'; fill.style.left='0'; fill.style.width='0'; bar.classList.remove('on'); }
      function toIdle(){ barOff(); proc.hidden = true; if (zoneActions) zoneActions.style.visibility = ''; mode = null; if (pendingScene) showScene(pendingScene); }
      // Подсказка разметки сцены (не процесс): спокойная статичная полоса + текст + ✕ (сброс разметки).
      function barScene(){ stop(); bar.classList.add('on'); fill.style.transition='none'; fill.style.opacity='0.5'; fill.style.left='0'; fill.style.width='100%'; fill.style.background='linear-gradient(90deg,transparent,'+ACC+' 50%,transparent)'; }
      function showScene(text){ mode='scene'; if(hideT){clearTimeout(hideT);hideT=null;} proc.hidden=false; if(zoneActions) zoneActions.style.visibility='hidden'; ptext.className='rlm-proc-text scene'; ptext.textContent=text; px.hidden=false; barScene(); }
      function show(text, cancelable){
        proc.hidden = false; if (zoneActions) zoneActions.style.visibility = 'hidden';   // кнопки на месте (не двигаются), просто перекрыты
        ptext.className = 'rlm-proc-text'; ptext.textContent = text || '';
        px.hidden = !cancelable; bar.classList.add('on');
      }
      // подгрузка модели: полоса ДВИЖЕТСЯ (бегущая)
      function barLoad(){ stop(); bar.classList.add('on'); fill.style.transition='none'; fill.style.opacity='1'; fill.style.width='40%';
        fill.style.background='linear-gradient(90deg,transparent,'+ACC+',transparent)';
        let p=-40; anim=setInterval(()=>{ p+=4; if(p>100)p=-40; fill.style.left=p+'%'; },35); }
      // генерация (неизмеримо): ДЫХАНИЕ — тухнет/светится, к краям затухает
      function barPulse(){ stop(); bar.classList.add('on'); fill.style.transition='none'; fill.style.left='0'; fill.style.width='100%';
        fill.style.background='linear-gradient(90deg,transparent,'+ACC+' 50%,transparent)';
        let t=0; anim=setInterval(()=>{ t+=0.09; fill.style.opacity=(0.4+0.6*(0.5+0.5*Math.sin(t))).toFixed(2); },35); }
      // измеримо (Душа по докам / генерация аудио по времени): заливка по доле
      function barDet(frac){ stop(); bar.classList.add('on'); fill.style.transition='width .3s ease'; fill.style.opacity='1'; fill.style.left='0';
        fill.style.background=ACC; fill.style.width=Math.round(Math.max(0,Math.min(1,frac||0))*100)+'%'; }
      function barDone(){ stop(); bar.classList.add('on'); fill.style.transition='width .3s ease'; fill.style.opacity='1'; fill.style.left='0'; fill.style.width='100%'; fill.style.background='#6ee87a'; }
      function barFail(){ stop(); bar.classList.add('on'); fill.style.transition='none'; fill.style.opacity='1'; fill.style.left='0'; fill.style.width='100%'; fill.style.background='#e0645a'; }

      window.rlmProc = function(m){
        if (hideT) { clearTimeout(hideT); hideT = null; }
        const st = m.state;
        if (st === 'error' || st === 'cancel' || st === 'idle') trBusyClear();   // перевод оборвался — кнопки снова живые

        if (st !== 'idle') mode = 'proc';   // реальный процесс перекрывает подсказку сцены (вернётся из pendingScene, когда лента освободится)
        if (st === 'idle')  { toIdle(); return; }
        if (st === 'done')  { proc.hidden=false; if(zoneActions) zoneActions.style.visibility='hidden'; ptext.className='rlm-proc-text ok';  ptext.textContent=m.text||'Готово';  px.hidden=true; barDone(); hideT=setTimeout(toIdle,1500); return; }
        if (st === 'error' || st === 'cancel') { proc.hidden=false; if(zoneActions) zoneActions.style.visibility='hidden'; ptext.className='rlm-proc-text err'; ptext.textContent=m.text||(st==='cancel'?'Прервано':'Ошибка'); px.hidden=true; barFail(); hideT=setTimeout(toIdle,1500); return; }
        show(m.text, m.cancelable !== false);
        if (st === 'load') barLoad();
        else if (st === 'pulse') barPulse();
        else if (st === 'fill' || st === 'grow') barDet(m.frac);
      };
      // крестик: процесс → отмена процесса (наружу); подсказка сцены → сброс разметки.
      px.addEventListener('click', () => { if (mode === 'scene') { if (window.rlmSceneCancel) window.rlmSceneCancel(); } else parent.postMessage({ type: 'proc-cancel' }, '*'); });
      // Подсказка «отметь конец/начало сцены»: text=null убирает. Идёт процесс → ждёт в pendingScene, покажется, когда лента освободится.
      window.rlmSceneHint = function(text){ if (!text) { pendingScene = null; if (mode === 'scene') toIdle(); return; } pendingScene = text; if (mode === 'proc') return; showScene(text); };
    })();

    // Мобильный чат = погружение на телефоне (#st-frame на всю ширину экрана < 720px).
    // В мини-чате ноды логическая ширина 1000px → false, лист не показываем (там правка не нужна).
    function isMobileChat() { try { return window.matchMedia('(max-width: 720px)').matches; } catch (_) { return false; } }

    // Мобильный лист над клавиатурой — ОБЩИЙ для правки реплики и фидбека: закреплён над клавиатурой
    // (не уезжает целиком), текст скроллится внутри. Заголовок/значение/кнопку/действие задаёт вызывающий.
    function openMobileSheet(opts) {
      if (document.querySelector('.mes-edit-sheet')) return;   // одно окно за раз
      const back = document.createElement('div'); back.className = 'mes-edit-backdrop';
      const sheet = document.createElement('div'); sheet.className = 'mes-edit-sheet';
      sheet.innerHTML = '<div class="mes-edit-bar">'
        + '<button class="mes-edit-btn mes-edit-cancel">Отмена</button>'
        + '<span class="mes-edit-title">' + esc(opts.title || 'Правка') + '</span>'
        + '<button class="mes-edit-btn mes-edit-save">' + esc(opts.saveLabel || 'Готово') + '</button></div>';
      const ed = document.createElement('textarea'); ed.className = 'mes-edit'; ed.value = opts.value || '';
      if (opts.placeholder) ed.placeholder = opts.placeholder;
      sheet.appendChild(ed);
      document.body.appendChild(back); document.body.appendChild(sheet);

      // Закрепляем лист над клавиатурой по visualViewport: bottom = высота клавиатуры,
      // высота листа = почти вся видимая область. Пересчёт при появлении/скрытии клавиатуры.
      const vv = window.visualViewport;
      function fit() {
        if (vv) {
          const kb = Math.max(0, window.innerHeight - (vv.offsetTop + vv.height));
          sheet.style.bottom = kb + 'px';
          sheet.style.height = Math.round(vv.height) + 'px';   // на ВСЮ видимую область над клавиатурой (не оставлять пустое место сверху)
        } else {
          sheet.style.bottom = '0'; sheet.style.height = '100vh';
        }
      }
      fit();
      if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }

      let done = false;
      function close() {
        if (done) return; done = true;
        if (vv) { vv.removeEventListener('resize', fit); vv.removeEventListener('scroll', fit); }
        back.remove(); sheet.remove();
      }
      function cancel() { close(); if (opts.onCancel) opts.onCancel(); }
      function save() { if (done) return; if (opts.onSave) opts.onSave(ed.value, close); else close(); }
      sheet.querySelector('.mes-edit-save').addEventListener('click', save);
      sheet.querySelector('.mes-edit-cancel').addEventListener('click', cancel);
      back.addEventListener('click', cancel);
      ed.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') cancel(); });   // Enter = перенос строки, НЕ сохранение
      ed.focus();
      try { ed.setSelectionRange(ed.value.length, ed.value.length); } catch (_) { /* игнор */ }
    }
    // Мобильная правка реплики — лист «Правка сообщения».
    function openMobileEdit(idx, raw) {
      openMobileSheet({
        title: 'Правка сообщения', value: raw, saveLabel: 'Готово',
        onSave: (val, close) => { parent.postMessage({ type: 'edit', idx, text: val }, '*'); close(); },
        onCancel: () => renderMessages(currentMsgs),
      });
    }
    // Мобильный фидбек по ответу ИИ — тот же лист (пусто → просто закрыть, без переката).
    function openMobileFeedback(idx) {
      openMobileSheet({
        title: 'Фидбек: переписать ответ', value: '', saveLabel: 'Отправить',
        placeholder: 'В чём фидбек? Что не так — перепишу ответ.',
        onSave: (val, close) => { const t = (val || '').trim(); if (t) parent.postMessage({ type: 'feedback', idx, text: t }, '*'); close(); },
      });
    }

    // ---- Правка реплики: клик по «карандашу» → inline-редактор → сохранить (Enter) / отмена (Esc) ----
    const chatEl = document.getElementById('chat');
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const pen = e.target.closest('[data-edit]'); if (!pen) return;
      e.stopPropagation();
      const mes = pen.closest('.mes'); if (!mes || mes.querySelector('.mes-edit')) return;
      const idx = Number(pen.dataset.edit);
      const textEl = mes.querySelector('.mes_text');
      const raw = (currentMsgs[idx] && currentMsgs[idx].text != null) ? currentMsgs[idx].text : textEl.textContent;
      if (isMobileChat()) { openMobileEdit(idx, raw); return; }   // телефон: закреплённый лист над клавиатурой
      const ed = document.createElement('textarea');
      ed.className = 'mes-edit'; ed.value = raw;
      textEl.style.display = 'none';
      textEl.parentNode.insertBefore(ed, textEl.nextSibling);
      ed.style.overflow = 'hidden';   // растём в высоту, а не прячем текст под внутренний скролл
      const autoFit = () => { ed.style.height = 'auto'; ed.style.height = (ed.scrollHeight + 2) + 'px'; };  // +2 — под рамку (border-box)
      autoFit(); ed.addEventListener('input', autoFit);
      ed.focus({ preventScroll: true });   // не дёргать прокрутку чата в самый низ при входе в редактирование
      try { ed.setSelectionRange(ed.value.length, ed.value.length); } catch (e) { /* игнор */ }
      let done = false;
      const save = () => { if (done) return; done = true; parent.postMessage({ type: 'edit', idx, text: ed.value }, '*'); };
      ed.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); save(); }
        else if (ev.key === 'Escape') { done = true; renderMessages(currentMsgs); }
      });
      ed.addEventListener('blur', save);
    });

    // ---- Перегенерация: клик по ↻ на последнем ответе ИИ → наружу (regenerate) ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const rb = e.target.closest('[data-regen]'); if (!rb) return;
      e.stopPropagation();
      parent.postMessage({ type: 'regen' }, '*');
    });

    // ---- Выбор первого сообщения (перед началом ролки): клик по ‹ › на приветствии → наружу ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const ga = e.target.closest('.rlm-greet-arrow'); if (!ga) return;
      e.stopPropagation();
      parent.postMessage({ type: 'greet-swipe', dir: Number(ga.dataset.greetDir) || 1 }, '*');
    });

    // ---- Окно разбора критика: клик по тегу под сообщением → окошко (как окно правки), но ТОЛЬКО просмотр ----
    // Раньше разбор вставлялся ПРЯМО в чат (.mes-review-panel). Теперь открывается отдельным окном поверх —
    // на десктопе и на телефоне одинаково, — как окно правки, но реплику не редактирует.
    let critModalClose = null;
    function openCritModal(idx, title, innerHtml) {
      if (critModalClose) critModalClose();                       // одно окно за раз
      const back = document.createElement('div');
      back.className = 'crit-modal-backdrop'; back.id = 'rlm-crit-modal'; back.dataset.idx = idx;
      const box = document.createElement('div'); box.className = 'crit-modal';
      box.innerHTML = '<div class="crit-modal-bar"><span class="crit-modal-title">' + esc(title) + '</span>'
        + '<span class="crit-modal-x interactable" title="Закрыть">✕</span></div>'
        + '<div class="crit-modal-body">' + innerHtml + '</div>';
      back.appendChild(box); document.body.appendChild(back);
      function onKey(ev) { if (ev.key === 'Escape') close(); }
      function close() {
        if (!critModalClose) return; critModalClose = null;
        document.removeEventListener('keydown', onKey); back.remove();
      }
      critModalClose = close;
      document.addEventListener('keydown', onKey);
      back.addEventListener('click', (ev) => { if (ev.target === back) close(); });   // клик по фону — закрыть
      box.querySelector('.crit-modal-x').addEventListener('click', close);
      return box;
    }

    // «Апрув редактора» (критик переписал): было / разбор судьи / стало + перевод. Окно, только чтение.
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-review]'); if (!b) return;
      e.stopPropagation();
      const mes = b.closest('.mes'); const idx = Number(mes.getAttribute('mesid'));
      const m = currentMsgs[idx]; if (!m || !m.criticReview) return;
      const cr = m.criticReview;
      // Только САМ разбор судьи (вердикт/причина/урок). Полные тексты «Было»/«Стало» не показываем —
      // они и так на экране (старый снесён, новый в ленте), а окно из-за них превращалось в простыню.
      const box = openCritModal(idx, '⚖ Апрув редактора',
          '<div class="mrp-sec"><div class="mrp-h">Разбор судьи</div><div class="mrp-t" data-mrp="reason">' + esc(cr.reason || '') + '</div></div>'
        + '<div class="mrp-tr interactable" data-review-tr="' + idx + '">🌐 Перевести на русский</div>');
      const tb = box.querySelector('[data-review-tr]');
      if (tb) tb.addEventListener('click', () => {
        const mm = currentMsgs[idx]; if (!mm || !mm.criticReview) return;
        const c = mm.criticReview; tb.textContent = '🌐 перевожу…';
        parent.postMessage({ type: 'translate-review', idx: idx, texts: [c.reason || ''] }, '*');
      });
    });

    // «Критик: апрув ✓» (одобрение): почему одобрил + поле «не согласен» → урок критику. Тоже окно.
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-approve]'); if (!b) return;
      e.stopPropagation();
      const mes = b.closest('.mes'); const idx = Number(mes.getAttribute('mesid'));
      const m = currentMsgs[idx]; if (!m || !m.critic || !m.critic.ok) return;
      const reason = (m.critic.reason || '').trim() || '(критик пояснения не дал)';
      const box = openCritModal(idx, '⚖ Критик: апрув ✓',
          '<div class="mrp-sec"><div class="mrp-h">Почему критик одобрил <button class="tr-b crit-tr-reason interactable" type="button" title="Перевести ответ критика на русский (повторно — оригинал)">RU</button></div><div class="mrp-t" data-mrp="reason">' + esc(reason) + '</div></div>'
        + '<div class="mrp-sec"><div class="mrp-h">Не согласен? Скажи, что критик упустил <button class="tr-b crit-tr-fb interactable" type="button" data-fb-dir="ru" title="Перевести твой текст на русский (замена)">RU</button><button class="tr-b crit-tr-fb interactable" type="button" data-fb-dir="en" title="Перевести твой текст на английский (замена)">EN</button></div><textarea class="mes-edit crit-approve-fb" placeholder="напр.: тут он подлизал, а ты пропустил"></textarea></div>'
        + '<div class="crit-approve-actions">'
        + '<div class="mrp-tr crit-approve-send interactable" title="Учит критика на будущее: пишет урок в блокнот">Записать в блокнот</div>'
        + '<div class="mrp-tr crit-approve-rewrite interactable" title="Разово переписать ИМЕННО этот ответ по замечанию, урок НЕ пишется">Не записывать · переписать</div>'
        + '</div>');
      const fa = box.querySelector('.crit-approve-fb'); if (fa) fa.focus();
      // RU (квадратная, как в ноде) — предпросмотр перевода ОТВЕТА критика EN→RU (нажал → RU, ещё раз → оригинал).
      const trReason = box.querySelector('.crit-tr-reason');
      if (trReason) trReason.addEventListener('click', () => {
        const cell = box.querySelector('.mrp-t[data-mrp="reason"]'); if (!cell) return;
        if (cell.dataset.trShown === '1') { cell.textContent = cell.dataset.trOrig || ''; cell.dataset.trShown = '0'; trReason.classList.remove('on'); return; }   // повторно → оригинал
        if (cell.dataset.trText) { cell.textContent = cell.dataset.trText; cell.dataset.trShown = '1'; trReason.classList.add('on'); return; }                     // уже переводили — показать
        cell.dataset.trOrig = cell.textContent; trReason.classList.add('busy');
        parent.postMessage({ type: 'translate-approve', idx: idx, text: (currentMsgs[idx] && currentMsgs[idx].critic && currentMsgs[idx].critic.reason || '').trim() }, '*');
      });
      // RU / EN (квадратные, как в ноде) — перевод ТВОЕГО текста в поле фидбека в нужную сторону (замена).
      box.querySelectorAll('.crit-tr-fb').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!fa || !fa.value.trim()) return;
          box.querySelectorAll('.crit-tr-fb').forEach((b) => b.classList.remove('busy'));
          btn.classList.add('busy');
          parent.postMessage({ type: 'translate-fb', to: btn.dataset.fbDir, text: fa.value }, '*');
        });
      });
      const s = box.querySelector('.crit-approve-send');
      if (s) s.addEventListener('click', () => {
        const val = (fa && fa.value.trim()) || ''; if (!val) return;
        s.textContent = 'записываю…';
        parent.postMessage({ type: 'critic-approve-feedback', idx: idx, text: val }, '*');
      });
      const rw = box.querySelector('.crit-approve-rewrite');
      if (rw) rw.addEventListener('click', () => {
        const val = (fa && fa.value.trim()) || ''; if (!val) return;   // без замечания нечего переписывать
        rw.textContent = 'переписываю…';
        parent.postMessage({ type: 'critic-approve-rewrite', idx: idx, text: val }, '*');
      });
    });

    // ---- Фидбек: клик по 💬 у ответа ИИ → ОКНО (как плашка критика) с полем и кнопками RU/EN → перекат ответа ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const fb = e.target.closest('[data-fb]'); if (!fb) return;
      e.stopPropagation();
      const idx = Number(fb.dataset.fb);
      const box = openCritModal(idx, '💬 Фидбек — переписать ответ',
          '<div class="mrp-sec"><div class="mrp-h">Что не так? Перепишу ответ по замечанию <button class="tr-b crit-tr-fb interactable" type="button" data-fb-dir="ru" title="Перевести твой текст на русский (замена)">RU</button><button class="tr-b crit-tr-fb interactable" type="button" data-fb-dir="en" title="Перевести твой текст на английский (замена)">EN</button></div><textarea class="mes-edit crit-approve-fb" placeholder="напр.: он слишком легко согласился — перепиши жёстче"></textarea></div>'
        + '<div class="mrp-sec fb-reason-sec"><div class="mrp-h">Режим правки</div><select class="fb-mode interactable"><option value="hard" selected>⚖ Перепись — написать иначе</option><option value="soft">✎ Точечно — менять только названное</option></select></div>'
        + '<div class="mrp-sec fb-reason-sec"><div class="mrp-h">Рассуждение при переписи</div><select class="fb-reason interactable"><option value="node">Как в ноде «Опции»</option><option value="off">Выкл</option><option value="low" selected>Короткое</option><option value="medium">Среднее</option><option value="high">Длинное</option></select></div>'
        + '<div class="crit-approve-actions">'
        + '<div class="mrp-tr crit-fb-learn interactable" title="Переписать ответ по замечанию И записать урок критику в блокнот">Записать в блокнот</div>'
        + '<div class="mrp-tr crit-fb-send interactable" title="Переписать этот ответ по замечанию">Переписать</div>'
        + '</div>');
      const fa = box.querySelector('.crit-approve-fb'); if (fa) fa.focus();
      // RU / EN — перевод ТВОЕГО текста в поле (замена), тот же механизм, что в окне апрува.
      box.querySelectorAll('.crit-tr-fb').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!fa || !fa.value.trim()) return;
          box.querySelectorAll('.crit-tr-fb').forEach((b) => b.classList.remove('busy'));
          btn.classList.add('busy');
          parent.postMessage({ type: 'translate-fb', to: btn.dataset.fbDir, text: fa.value }, '*');
        });
      });
      const learn = box.querySelector('.crit-fb-learn');
      if (learn) learn.addEventListener('click', () => {
        const val = (fa && fa.value.trim()) || ''; if (!val) return;
        const rz = box.querySelector('.fb-reason'); const reason = rz ? rz.value : 'node';   // то же рассуждение при переписи, что у «Переписать»
        const mz = box.querySelector('.fb-mode'); const mode = mz ? mz.value : 'hard';     // точечно / перепись
        learn.textContent = 'переписываю + пишу…';
        parent.postMessage({ type: 'feedback-learn', idx: idx, text: val, reason: reason, mode: mode }, '*');   // И перекат по замечанию, И урок в блокнот
        if (critModalClose) critModalClose();
      });
      const send = box.querySelector('.crit-fb-send');
      if (send) send.addEventListener('click', () => {
        const val = (fa && fa.value.trim()) || ''; if (!val) return;
        const rz = box.querySelector('.fb-reason'); const reason = rz ? rz.value : 'node';   // рассуждение при переписи (node = как в «Опциях»)
        const mz = box.querySelector('.fb-mode'); const mode = mz ? mz.value : 'hard';     // точечно (правим только названное) / перепись (пишем иначе)
        send.textContent = 'переписываю…';
        parent.postMessage({ type: 'feedback', idx: idx, text: val, reason: reason, mode: mode }, '*');   // перекат по замечанию (без авто-урока — урок отдельной кнопкой)
        if (critModalClose) critModalClose();   // окно закрыть — перекат идёт в чате
      });
    });

    // ---- «Раскрыть вероятность»: забираем ближайший исход СЕБЕ (модели он уже не уйдёт) ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const rb = e.target.closest('[data-roll-peek]'); if (!rb) return;
      e.stopPropagation();
      rb.classList.add('busy');
      parent.postMessage({ type: 'random-peek', idx: Number(rb.dataset.rollPeek) }, '*');
    });
    // ---- Перевод ПРИЧИН состояния под сообщением: RU (тумблер оригинал/перевод, кэш в m._stateRtr) ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const tb = e.target.closest('[data-st-tr]'); if (!tb) return;
      e.stopPropagation();
      const idx = Number(tb.dataset.stTr);
      const mm = currentMsgs[idx]; if (!mm || !mm._stateR) return;
      if (mm._showStateTr) { mm._showStateTr = false; renderMessages(currentMsgs); return; }   // назад к оригиналу
      if (mm._stateRtr) { mm._showStateTr = true; renderMessages(currentMsgs); return; }         // из кэша
      tb.classList.add('busy');
      const stNames = {}; lastStateDefs.forEach((v) => { stNames[v.id] = v.name; });   // имена состояний — тоже на перевод
      parent.postMessage({ type: 'translate-st', idx: idx, reasons: mm._stateR, names: stNames }, '*');
    });

    // Подсказка разметки сцены: пока отмечена ТОЛЬКО одна граница — в ленте «отметь вторую» + ✕ (сброс).
    // Выводится из sceneStart/sceneEnd → переживает перерисовки и прыжки по Оглавлению (ничего не слетает).
    function updateSceneHint(){
      if (!window.rlmSceneHint) return;
      const one = (sceneStart != null) !== (sceneEnd != null);   // ровно одна граница
      if (!one) { window.rlmSceneHint(null); return; }
      window.rlmSceneHint(sceneStart != null ? 'Отметь КОНЕЦ сцены ◄ · ✕ сбросить' : 'Отметь НАЧАЛО сцены ► · ✕ сбросить');
    }
    window.rlmSceneCancel = function(){ sceneStart = null; sceneEnd = null; parent.postMessage({ type:'scene', start:null, end:null }, '*'); renderMessages(currentMsgs); };
    // ---- Разметка сцены: клик по ►/◄ отмечает начало/конец (как MachineMechanic) ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const sb = e.target.closest('[data-scene-start]');
      const eb = e.target.closest('[data-scene-end]');
      if (!sb && !eb) return;
      e.stopPropagation();
      if (sb) { const i = Number(sb.dataset.sceneStart); sceneStart = (sceneStart === i) ? null : i; }
      else    { const i = Number(eb.dataset.sceneEnd);   sceneEnd   = (sceneEnd === i)   ? null : i; }
      renderMessages(currentMsgs);
      parent.postMessage({ type: 'scene', start: sceneStart, end: sceneEnd }, '*');
    });

    // ---- Перевод СООБЩЕНИЯ: EN→RU, предпросмотр (повторно — оригинал) ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const tb = e.target.closest('[data-translate]'); if (!tb) return;
      e.stopPropagation();
      const idx = Number(tb.dataset.translate);
      const mm = currentMsgs[idx]; if (!mm) return;
      if (mm._showTr) { mm._showTr = false; renderMessages(currentMsgs); parent.postMessage({ type: 'mes-tr-toggle', idx: idx, show: false }, '*'); return; }    // назад к оригиналу (запомнить в родителе)
      if (mm._tr != null) { mm._showTr = true; renderMessages(currentMsgs); parent.postMessage({ type: 'mes-tr-toggle', idx: idx, show: true }, '*'); return; }  // из кэша (запомнить в родителе)
      tb.classList.add('mes-tr-busy');
      parent.postMessage({ type: 'translate-mes', idx: idx, text: mm.text }, '*');
    });
    // ---- Озвучка сообщения: 🔊 → наружу. Озвучиваем ПОКАЗАННЫЙ текст (если открыт перевод — его) ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const sb = e.target.closest('[data-tts]'); if (!sb) return;
      e.stopPropagation();
      const idx = Number(sb.dataset.tts);
      const mm = currentMsgs[idx];
      const shown = mm ? ((mm._showTr && mm._tr != null) ? mm._tr : mm.text) : '';
      parent.postMessage({ type: 'tts', idx: idx, text: shown }, '*');
    });
    // ---- Удаление СООБЩЕНИЯ: ✕ рядом с карандашом → убрать конкретную реплику (наружу, родитель правит лог) ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const db = e.target.closest('[data-del]'); if (!db) return;
      e.stopPropagation();
      const idx = Number(db.dataset.del);
      parent.postMessage({ type: 'delete-mes', idx: idx }, '*');
    });
    // ---- Ветка: ⑃ в шапке сообщения → новый чат-копия истории до этого места (наружу, родитель ветвит) ----
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const bb = e.target.closest('[data-branch]'); if (!bb) return;
      e.stopPropagation();
      const idx = Number(bb.dataset.branch);
      parent.postMessage({ type: 'branch', idx: idx }, '*');
    });
    // ---- Аватарка: клик по аве в сообщении → картинка на весь экран (крестик/Esc/клик по фону — закрыть) ----
    let avaLightboxClose = null;
    function openAvatarLightbox(src){
      if (avaLightboxClose) avaLightboxClose();                  // одно окно за раз
      const back = document.createElement('div'); back.className = 'ava-lightbox';
      const big = document.createElement('img'); big.src = src; big.alt = '';
      const x = document.createElement('div'); x.className = 'ava-lightbox-x interactable'; x.title = 'Закрыть'; x.textContent = '✕';
      back.appendChild(big); back.appendChild(x); document.body.appendChild(back);
      function onKey(ev){ if (ev.key === 'Escape') { ev.stopPropagation(); close(); } }
      function close(){ if (!avaLightboxClose) return; avaLightboxClose = null; document.removeEventListener('keydown', onKey, true); back.remove(); }
      avaLightboxClose = close;
      document.addEventListener('keydown', onKey, true);         // capture: Esc гасит лайтбокс раньше выхода из вижна
      back.addEventListener('click', (ev) => { if (ev.target === back) close(); });   // клик по фону — закрыть
      x.addEventListener('click', close);
    }
    if (chatEl) chatEl.addEventListener('click', (e) => {
      const img = e.target.closest('.mesAvatarWrapper .avatar img'); if (!img) return;
      e.stopPropagation();
      const src = img.getAttribute('src'); if (!src) return;
      openAvatarLightbox(src);
    });
    // ---- Перевод ПОЛЯ ВВОДА: RU→EN, реальная замена ----
    const trInputBtn = document.getElementById('rlm-tr-input');
    if (trInputBtn) trInputBtn.addEventListener('click', () => {
      if (!ta || !ta.value.trim()) return;
      if (trInputBtn.classList.contains('busy')) return;   // уже переводим
      trInputBtn.classList.add('busy');
      if (window.__trT) clearTimeout(window.__trT);
      window.__trT = setTimeout(trBusyClear, 90000);       // ответа нет полторы минуты — вернуть кнопку, а не держать серой навсегда
      parent.postMessage({ type: 'translate-input', text: ta.value }, '*');
    });
    // Снять «занято» со всех кнопок перевода: успех, отмена, ошибка или молчание провайдера.
    function trBusyClear() {
      if (window.__trT) { clearTimeout(window.__trT); window.__trT = null; }
      const b = document.getElementById('rlm-tr-input'); if (b) b.classList.remove('busy');
      document.querySelectorAll('.mes-tr-busy, .busy[data-mes-tr], .busy[data-roll-peek]').forEach((n) => n.classList.remove('busy'));
    }
    window.trBusyClear = trBusyClear;
    // ---- Оглавление (значок списка): родитель строит панель глав из записей «Хроники» ----
    const tocBtn = document.querySelector('.fa-list-ol');
    if (tocBtn) tocBtn.addEventListener('click', () => parent.postMessage({ type: 'chronicle-toc' }, '*'));
    // ---- Лорбук чата (значок книги, рядом): родитель открывает ВИЖН ноды «Лорбук чата» ----
    const loreBtn = document.querySelector('.rlm-lore-open');
    if (loreBtn) loreBtn.addEventListener('click', () => parent.postMessage({ type: 'lore-open' }, '*'));
    // ---- Состояние (значок ползунков, рядом): родитель открывает ВИЖН ноды «Состояние» ----
    const stateBtn = document.querySelector('.rlm-state-open');
    if (stateBtn) stateBtn.addEventListener('click', () => parent.postMessage({ type: 'state-open' }, '*'));
    const objectiveBtn = document.querySelector('.rlm-objective-open');
    if (objectiveBtn) objectiveBtn.addEventListener('click', () => parent.postMessage({ type: 'objective-open' }, '*'));
    const randomBtn = document.querySelector('.rlm-random-open');
    if (randomBtn) randomBtn.addEventListener('click', () => parent.postMessage({ type: 'random-open' }, '*'));
    // ---- Режиссёр (значок камеры, рядом): родитель открывает ВИЖН ноды «Режиссёр» (события сцены) ----
    const dirBtn = document.querySelector('.rlm-director-open');
    if (dirBtn) dirBtn.addEventListener('click', () => parent.postMessage({ type: 'director-open' }, '*'));
    // ---- Гости и визитёры (значок людей): родитель открывает список записей лорбука чата (.guest/.npc) ----
    const guestsBtn = document.querySelector('.rlm-guests-open');
    if (guestsBtn) guestsBtn.addEventListener('click', () => parent.postMessage({ type: 'guests-open' }, '*'));
    // ---- Инструменты (гаечный ключ): родитель открывает меню вижнов нод без своей кнопки (комплитер, API, Хроника, Озвучка) ----
    const toolsBtn = document.querySelector('.fa-wrench');
    if (toolsBtn) toolsBtn.addEventListener('click', () => parent.postMessage({ type: 'tools-menu' }, '*'));
    // ---- Память (значок мозга): родитель открывает ВИЖН ноды «Душа» (её доки/записи) — как глазок на самой Душе ----
    const memBrainBtn = document.querySelector('.fa-brain');
    if (memBrainBtn) memBrainBtn.addEventListener('click', () => parent.postMessage({ type: 'soul-open' }, '*'));

    // ---- Clip: кнопка появляется ТОЛЬКО у выделенного текста внутри сообщения (условие как в MachineMechanic).
    //      Нет выделения — нет кнопки (не перекрывает чат). По клику шлём выделение родителю (type:'clip'). ----
    (function(){
      const fab = document.createElement('button');
      fab.type = 'button'; fab.id = 'stmb-clip-fab';
      fab.innerHTML = '<span class="cic">✂</span>Clip';
      document.body.appendChild(fab);
      let curText = '';
      // Состояние выделения: непустой текст ВНУТРИ .mes (не в поле правки) → вернуть {text, rect}.
      function selInMes(){
        const sel = window.getSelection && window.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
        const text = (sel.toString() || '').trim();
        if (!text) return null;
        const chat = document.getElementById('chat');
        if (!chat || !chat.contains(sel.anchorNode) || !chat.contains(sel.focusNode)) return null;
        const anc = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
        if (!anc || !anc.closest('.mes') || anc.closest('.mes-edit')) return null;
        const rect = sel.getRangeAt(0).getBoundingClientRect();
        if (!rect || (rect.width === 0 && rect.height === 0)) return null;
        return { text, rect };
      }
      function updateFab(){
        const st = selInMes();
        if (!st) { fab.style.display = 'none'; curText = ''; return; }
        curText = st.text;
        fab.style.display = 'flex';
        const bw = fab.offsetWidth || 62, bh = fab.offsetHeight || 26;
        let x = Math.min(st.rect.right + 6, window.innerWidth - bw - 6); x = Math.max(6, x);
        let y = st.rect.top - bh - 4; if (y < 4) y = st.rect.bottom + 6;   // не влезло сверху — снизу выделения
        fab.style.left = x + 'px'; fab.style.top = y + 'px';
      }
      document.addEventListener('mouseup', () => setTimeout(updateFab, 0));
      document.addEventListener('selectionchange', () => { const s = window.getSelection(); if (!s || s.isCollapsed) { fab.style.display = 'none'; curText = ''; } });
      const chatSc = document.getElementById('chat');
      if (chatSc) chatSc.addEventListener('scroll', () => { fab.style.display = 'none'; });
      fab.addEventListener('mousedown', (e) => e.preventDefault());   // не сбрасывать выделение до клика
      fab.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!curText) return;
        parent.postMessage({ type: 'clip', text: curText }, '*');
        fab.style.display = 'none'; curText = '';
        const s = window.getSelection(); if (s) s.removeAllRanges();
      });
      window.__stmbHideClip = () => { fab.style.display = 'none'; curText = ''; };
    })();
  </script>
</body>
</html>
